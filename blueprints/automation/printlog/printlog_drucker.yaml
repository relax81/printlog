blueprint:
  name: "printlog: Druck erfassen (Bambu Lab)"
  description: >-
    Meldet Start, Ende und Ende der Abkühlphase eines Bambu-Lab-Druckers als
    Event `printlog`. Der printlog-Container speichert daraus jeden Druck mit
    Material, Gewicht pro AMS-Fach, kWh und Vorschaubild. Lege pro Drucker eine
    Automation aus diesem Blueprint an. Braucht die Bambu-Lab-Integration
    (ha-bambulab). Eine Steckdose mit Energiezähler ist optional: ohne sie
    rechnet printlog mit der festen Leistung aus Einstellungen → Drucker.
    printlog übernimmt die hier gewählten Entitäten beim ersten Druck selbst.
  domain: automation
  author: printlog
  source_url: https://github.com/relax81/printlog/blob/main/blueprints/automation/printlog/printlog_drucker.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    printer:
      name: Drucker
      icon: mdi:printer-3d
      input:
        printer_key:
          name: Kurzname
          description: >-
            Kurz und eindeutig, nur Kleinbuchstaben, Ziffern und _, z. B. h2s.
            Unter diesem Namen führt printlog den Drucker. Für einen Drucker,
            den printlog schon kennt, denselben Kurznamen wie bisher nehmen.
          selector:
            text:
        print_status:
          name: Druckstatus
          description: >-
            Der Sensor „Druckstatus“ (…_print_status). Auftrag, Gewicht,
            Fortschritt und Vorschaubild findet die Automation über denselben
            Namensanfang.
          selector:
            entity:
              filter:
                - domain: sensor
                  integration: bambu_lab
        ams_units:
          name: AMS-Einheiten
          description: >-
            Pro AMS den Sensor von Fach 1 (…_tray_1), in der Reihenfolge AMS 1,
            AMS 2 usw. Leer lassen, wenn der Drucker kein AMS hat.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  integration: bambu_lab
        external_spool:
          name: Externe Spule
          description: Sensor der externen Spule (…_external_spool). Optional.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  integration: bambu_lab
    power:
      name: Strom
      icon: mdi:power-plug
      input:
        energy_sensor:
          name: Energiezähler (optional)
          description: >-
            Zählerstand in kWh, z. B. einer Shelly-Steckdose. Leer lassen ohne
            Steckdose.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy
        power_sensor:
          name: Leistung (optional)
          description: >-
            Aktuelle Leistung in W derselben Steckdose. Damit erkennt die
            Automation das Ende der Abkühlphase. Ohne sie wartet sie die
            maximale Abkühlzeit ab.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        price_entity:
          name: Strompreis (optional)
          description: >-
            Preis pro kWh in €, z. B. ein Zahlenwert-Helfer. Leer lassen, dann
            fragt printlog selbst die Entität aus PRICE_ENTITY ab
            (Standard input_number.strompreis).
          default: ""
          selector:
            entity:
              filter:
                - domain: [input_number, number, sensor]
    tuning:
      name: Feinheiten
      icon: mdi:tune
      collapsed: true
      input:
        standby_w:
          name: Standby-Leistung
          description: Unter diesem Wert gilt die Abkühlphase als vorbei.
          default: 30
          selector:
            number:
              min: 1
              max: 200
              step: 1
              unit_of_measurement: W
        cooldown_max:
          name: Abkühlphase höchstens
          default: 5
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: min
        meter_delay:
          name: Nachlauf für den Zähler
          description: >-
            Wartezeit nach der Abkühlphase, bis der Zähler den letzten Stand
            gemeldet hat. Shelly meldet etwa einmal pro Minute.
          default: 70
          selector:
            number:
              min: 0
              max: 300
              step: 5
              unit_of_measurement: s

mode: parallel
max: 5

variables:
  printer_key: !input printer_key
  status_entity: !input print_status
  ams_units: !input ams_units
  ext_entity: !input external_spool
  energy_entity: !input energy_sensor
  power_entity: !input power_sensor
  price_entity: !input price_entity
  standby_w: !input standby_w
  prefix: >-
    {{ status_entity | regex_replace('^sensor\\.', '') | regex_replace('_print_status$', '') }}
  ams: >-
    {{ ams_units | map('regex_replace', '^sensor\\.(.+)_tray_\\d+$', '\\1') | list }}

triggers:
  - trigger: state
    entity_id: !input print_status
    id: start
    to: running
    # Auch nach einer Pause: printlog erkennt am printer_start_time, ob es derselbe Druck ist.
    not_from: [running, unavailable, unknown, offline]
  - trigger: state
    entity_id: !input print_status
    id: stop
    from: [running, pause, prepare]
    to: [finish, failed]

actions:
  - alias: Start bzw. Ende sofort melden
    event: printlog
    event_data:
      phase: "{{ trigger.id }}"
      printer: "{{ printer_key }}"
      status: "{{ trigger.to_state.state }}"
      energy_kwh: "{{ states(energy_entity) if energy_entity else '' }}"
      price: "{{ states(price_entity) if price_entity else '' }}"
      printer_name: "{{ states('sensor.' ~ prefix ~ '_printer_name') }}"
      printer_start_time: "{{ states('sensor.' ~ prefix ~ '_start_time') }}"
      progress: "{{ states('sensor.' ~ prefix ~ '_print_progress') }}"
      task_name: "{{ states('sensor.' ~ prefix ~ '_task_name') }}"
      gcode_plate: "{{ states('sensor.' ~ prefix ~ '_gcode_filename') }}"
      gcode_file: "{{ states('sensor.' ~ prefix ~ '_gcode_file_downloaded') }}"
      weight_g: "{{ states('sensor.' ~ prefix ~ '_print_weight') }}"
      image_entity: "image.{{ prefix }}_cover_image"
      status_entity: "{{ status_entity }}"
      energy_entity: "{{ energy_entity }}"
      prefix: "{{ prefix }}"
      ams: "{{ ams | to_json }}"
      ext: "{{ ext_entity }}"
      materials: >-
        {% set w = 'sensor.' ~ prefix ~ '_print_weight' %}
        {% set attrs = states[w].attributes if states[w] else {} %}
        {% set ns = namespace(items=[]) %}
        {% for k, v in attrs.items() if k is match('AMS \\d+ Tray \\d+$') %}
          {% set n = k.split(' ')[1] | int %}
          {% set e = 'sensor.' ~ ams[n - 1] ~ '_tray_' ~ k.split(' ')[3] if 0 < n <= ams | length else '' %}
          {% set ns.items = ns.items + [{'slot': k, 'name': states(e) if e else none,
             'type': state_attr(e, 'type') if e else none,
             'color': state_attr(e, 'color') if e else none, 'grams': v}] %}
        {% endfor %}
        {% for k, v in attrs.items() if 'xternal' in k %}
          {% set ns.items = ns.items + [{'slot': k, 'name': states(ext_entity) if ext_entity else none,
             'type': state_attr(ext_entity, 'type') if ext_entity else none,
             'color': state_attr(ext_entity, 'color') if ext_entity else none, 'grams': v}] %}
        {% endfor %}
        {% if not ns.items %}
          {% set a = 'sensor.' ~ prefix ~ '_active_tray' %}
          {% set ns.items = [{'slot': 'aktiv', 'name': states(a), 'type': state_attr(a, 'type'),
             'color': state_attr(a, 'color'), 'grams': states(w) | float(0)}] %}
        {% endif %}
        {{ ns.items | to_json }}
  - condition: trigger
    id: stop
  - alias: Abkühlphase abwarten (nur mit Energiezähler)
    if:
      - condition: template
        value_template: "{{ energy_entity != '' }}"
    then:
      - alias: Bis die Leistung unter Standby fällt oder ein neuer Druck startet
        wait_template: >-
          {{ states(status_entity) in ['prepare', 'running']
             or (power_entity != '' and states(power_entity) | float(0) < standby_w) }}
        timeout:
          minutes: !input cooldown_max
        continue_on_timeout: true
      - alias: Bei direktem Neustart kein Nachlauf, sonst zählt das Aufheizen mit
        if:
          - condition: template
            value_template: "{{ states(status_entity) not in ['prepare', 'running'] }}"
        then:
          - delay:
              seconds: !input meter_delay
  - alias: Endgültigen Zählerstand melden
    event: printlog
    event_data:
      phase: final
      printer: "{{ printer_key }}"
      energy_kwh: "{{ states(energy_entity) if energy_entity else '' }}"
      price: "{{ states(price_entity) if price_entity else '' }}"
