# printlog – 3D print history and cost tracking, fed by Home Assistant.
#
# Quick start:
#   cp .env.example .env    # then set HA_URL and HA_TOKEN
#   docker compose up -d --build
#
# Portainer (Git stack): set the same variables under "Environment variables"
# instead of using a .env file.
services:
  printlog:
    build: .
    container_name: printlog
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Address of Home Assistant as seen from the container, e.g. http://192.168.1.10:8123
      HA_URL: ${HA_URL:-http://homeassistant.local:8123}
      # Long-lived access token (HA profile → Security). Required.
      HA_TOKEN: ${HA_TOKEN:?Set HA_TOKEN to a Home Assistant long-lived access token}
      # Entity holding the electricity price per kWh (used when the automation sends none).
      PRICE_ENTITY: ${PRICE_ENTITY:-input_number.strompreis}
      # Backup: empty = off. Mount a network folder at /backup below and set BACKUP_DIR=/backup.
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    ports:
      - "${PRINTLOG_PORT:-8095}:8080"
    volumes:
      - printlog-data:/data
      # Backup target, e.g. a NAS share mounted on the Docker host:
      # - /mnt/nas/backup/printlog:/backup

volumes:
  printlog-data:
